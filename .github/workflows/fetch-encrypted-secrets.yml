name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      # "release" mode: the caller (e.g. a CortenDesk console on a private
      # network) cannot be reached from GitHub, so it attached the encrypted
      # zip to a draft release of this repository and passed its id instead
      # of a URL: {"release_id": 123456}
      - name: Checkout (release mode)
        if: ${{ contains(inputs.zip_url_json, 'release_id') }}
        uses: actions/checkout@v4

      - name: Read release id
        if: ${{ contains(inputs.zip_url_json, 'release_id') }}
        id: release
        shell: bash
        env:
          ZIP_URL_JSON: ${{ inputs.zip_url_json }}
        run: echo "id=$(jq -r '.release_id' <<<"$ZIP_URL_JSON")" >> "$GITHUB_OUTPUT"

      - name: Fetch secrets.zip from draft release
        if: ${{ contains(inputs.zip_url_json, 'release_id') }}
        uses: ./.github/actions/release-asset
        with:
          release_id: ${{ steps.release.outputs.id }}
          name: secrets.zip
          output: secrets.zip
          token: ${{ github.token }}

      - name: Download with Retry
        if: ${{ !contains(inputs.zip_url_json, 'release_id') }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import requests
            import json
            import time

            input_data = json.loads('${{ inputs.zip_url_json }}')
            url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
            
            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url, timeout=20)
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1